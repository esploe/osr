# Minimal Xorg config for the render worker's WORKER_DISPLAY_MODE=xorg path
# (see docker/worker-entrypoint.sh). Goal: drive the GPU's real output
# hardware directly via the amdgpu DDX driver -- no VirtualGL bridging --
# against the connector that's been forced "connected" at the kernel level
# (video=<connector>:D boot param on the VM; Xorg will not set up a screen
# on an output the kernel still reports as disconnected).
#
# AllowEmptyInput: there's no physical keyboard/mouse in the container --
# without this Xorg refuses to start when it can't find any input devices.

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "AllowEmptyInput" "true"
EndSection

Section "Device"
    Identifier "AMD"
    Driver "amdgpu"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "AMD"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
