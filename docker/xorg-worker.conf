# Minimal Xorg config for the render worker's WORKER_DISPLAY_MODE=xorg path
# (see docker/worker-entrypoint.sh). Goal: drive the GPU's real output
# hardware directly via the amdgpu DDX driver -- no VirtualGL bridging --
# against the connector that's been forced "connected" at the kernel level
# (video=<connector>:D boot param on the VM; Xorg will not set up a screen
# on an output the kernel still reports as disconnected).
#
# AllowEmptyInput: there's no physical keyboard/mouse in the container --
# without this Xorg refuses to start when it can't find any input devices.
#
# BusID: this box has TWO PCI display devices -- Proxmox's own emulated
# Bochs/QEMU VGA console (which Xorg's own probing marks "primary" since
# it's first on the bus) and the real passed-through AMD GPU. Without
# AutoAddGPU/AutoAddDevices, an unconfigured Device section falls back
# toward that "primary" device instead -- which amdgpu obviously can't
# claim, producing "No devices detected" / "no screens found". Confirmed
# via a live Xorg log (`lspci`-equivalent PCI probe) that the real GPU
# (vendor 1002 = AMD, device 67df = Polaris) sits at 0000:00:10.0; Xorg's
# BusID syntax is decimal "PCI:bus:device:function", so device 0x10 = 16.
# If this ever changes (different VM/hardware), check the worker's own
# Xorg log for the "(--) PCI: ... 1002:67df" line and update accordingly.

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoAddDevices" "false"
    Option "AllowEmptyInput" "true"
EndSection

Section "Device"
    Identifier "AMD"
    Driver "amdgpu"
    BusID "PCI:0:16:0"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "AMD"
EndSection

Section "ServerLayout"
    Identifier "Layout0"
    Screen 0 "Screen0"
EndSection
