# Deploy this file on whichever machine should run the Discord bot -- same
# pattern as docker-compose.worker.yml for the GPU render worker: its own
# compose file/project, reaching the coordinator over a real LAN address
# instead of Docker Compose's internal service-name DNS (which only works
# for containers in the *same* compose project). Nothing stops this from
# running on the coordinator's own machine too, alongside docker-compose.yml
# -- just point COORDINATOR_URL at http://localhost:8080 in that case.
#
# The bot needs none of danser/ffmpeg/X11/GPU -- it only talks to Discord's
# gateway and the coordinator's already-public HTTP API (POST /api/render,
# same as the web UI's "Score URL" tab), so this is a much lighter
# deployment than the worker: no /dev/dri, no devices: section at all.
#
# Copy .env.example to .env here and fill in (see its "Discord bot"
# section for exact setup steps):
#   DISCORD_BOT_TOKEN=<from the Discord Developer Portal's Bot tab>
#   DISCORD_CLIENT_ID=<the application ID>
#   COORDINATOR_URL=http://<coordinator LAN IP>:8080
# Also needs OSU_CLIENT_ID/OSU_CLIENT_SECRET (score lookups) and
# ZIPLINE_URL/ZIPLINE_TOKEN (so it has a link to post) -- same values as
# the coordinator's own .env.
#
# Then: docker compose -f docker-compose.bot.yml up --build -d

services:
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: osu-replay-renderer-bot:local
    env_file:
      - .env
    environment:
      - BOT_DATA_DIR=/data
    volumes:
      - bot-data:/data
    restart: unless-stopped

volumes:
  bot-data:
