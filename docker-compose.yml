services:
  renderer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: osu-replay-renderer:local
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - RENDER_CONCURRENCY=1
    volumes:
      - render-data:/data
    restart: unless-stopped
    # Software OpenGL rendering is CPU + RAM heavy at higher resolutions.
    # Raise this if renders get OOM-killed (mem_limit works with plain
    # `docker compose up`, unlike deploy.resources which needs swarm mode).
    mem_limit: 4g
    shm_size: "1gb"

  bot:
    # Opt-in: only started by `docker compose --profile bot up ...`, not a
    # plain `docker compose up`. Without this, anyone who doesn't want the
    # Discord bot would get a container crash-looping forever the moment
    # they pull this change, since it refuses to start without
    # DISCORD_BOT_TOKEN/DISCORD_CLIENT_ID set (see .env.example).
    profiles: ["bot"]
    build:
      context: .
      dockerfile: bot/Dockerfile
    image: osu-replay-renderer-bot:local
    env_file:
      - .env
    environment:
      - COORDINATOR_URL=http://renderer:8080
      - BOT_DATA_DIR=/data
    volumes:
      - bot-data:/data
    depends_on:
      - renderer
    restart: unless-stopped

volumes:
  render-data:
  bot-data:
